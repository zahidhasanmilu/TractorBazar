{% extends 'layout.html' %}
{% load static %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <!-- Contact Page Header -->
            <div class="text-center mb-5">
                <h2 class="fw-bold">যোগাযোগ করুন</h2>
                <p class="text-muted">যেকোনো প্রশ্ন বা পরামর্শের জন্য আমাদের সাথে যোগাযোগ করুন।</p>
            </div>

            <!-- Contact Form -->
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <form>
                        <!-- Name Input -->
                        <div class="mb-3">
                            <label for="name" class="form-label">নাম</label>
                            <input type="text" class="form-control" id="name" placeholder="আপনার নাম লিখুন" required>
                        </div>
                        
                        <!-- Email Input -->
                        <div class="mb-3">
                            <label for="email" class="form-label">ইমেইল</label>
                            <input type="email" class="form-control" id="email" placeholder="আপনার ইমেইল লিখুন" required>
                        </div>

                        <!-- Subject Input -->
                        <div class="mb-3">
                            <label for="subject" class="form-label">বিষয়</label>
                            <input type="text" class="form-control" id="subject" placeholder="বিষয় লিখুন" required>
                        </div>

                        <!-- Message Textarea -->
                        <div class="mb-3">
                            <label for="message" class="form-label">বার্তা</label>
                            <textarea class="form-control" id="message" rows="5" placeholder="আপনার বার্তা লিখুন" required></textarea>
                        </div>

                        <!-- Submit Button -->
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary w-100">প্রেরণ করুন</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Contact Information -->
            <div class="text-center mt-5">
                <h4 class="fw-bold">আমাদের যোগাযোগ তথ্য</h4>
                <p><i class="fas fa-map-marker-alt text-primary"></i> ঢাকা, বাংলাদেশ</p>
                <p><i class="fas fa-phone-alt text-success"></i> <a href="tel:+880000000000" class="text-decoration-none">+88 000 000 0000</a></p>
                <p><i class="fas fa-envelope text-danger"></i> <a href="mailto:info@example.com" class="text-decoration-none">info@example.com</a></p>
            </div>
        </div>
    </div>
</section>
{% endblock content %}
